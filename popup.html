<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        padding: 12px;
        font-family: Arial, sans-serif;
      }
      h1 {
        font-size: 18px;
        margin-bottom: 8px;
      }
      .button {
        display: inline-block;
        width: 100%;
        padding: 10px;
        margin: 4px 0;
        text-align: center;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      .refresh {
        background-color: #4caf50;
      }
      .close {
        background-color: #f44336;
      }
      .ai {
        background-color: #1976d2;
      }
      .button:hover {
        opacity: 0.85;
      }
      .status {
        font-size: 12px;
        color: #555;
        min-height: 16px;
        margin-top: 4px;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        margin-top: 8px;
        padding: 8px;
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        resize: vertical;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .actions button {
        flex: 1;
        padding: 8px;
        font-size: 12px;
        background-color: #616161;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .actions button:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <h1>Page Control</h1>
    <button class="button refresh" id="refreshBtn">Refresh Page</button>
    <button class="button close" id="closeBtn">Close Tab</button>
    <button class="button ai" id="analyzeBtn">Analyze with AI</button>
    <div class="status" id="status"></div>
    <textarea id="aiOutput" placeholder="AI insights will appear here" readonly></textarea>
    <div class="actions">
      <button id="copyBtn">Copy JSON</button>
      <button id="exportBtn">Export JSON</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
